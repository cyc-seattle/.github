name: ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run install
        env:
          # Pulumi authenticates the plugin downloads an install may make with this, which avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run ci

name: pull-request

on:
  pull_request:
    # edited: check the PR title again when it changes.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  pr-title:
    uses: ./.github/workflows/pr-title.yml
    permissions:
      pull-requests: read

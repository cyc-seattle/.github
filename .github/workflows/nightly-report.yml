name: nightly-report

on:
  workflow_call:
    inputs:
      result:
        description: The nightly dev job's result, such as `needs.dev.result`.
        type: string
        required: true
      assignee:
        description: Who the issue is assigned to, so GitHub emails them when it opens.
        type: string
        required: true
      title:
        description: The issue's title. The workflow finds its open issue by it.
        type: string
        default: Nightly integration run failed
      tested:
        description: The commit the tests ran on, such as deploy.yml's `tested`. With `passed`, a failure lists the PRs between them.
        type: string
        default: ""
      passed:
        description: The last commit the tests passed on, such as deploy.yml's `passed`.
        type: string
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    # Takes the caller's permissions: `actions: read` and `issues: write`, and `contents: read` to list
    # the PRs from `tested`. Asking for contents here would break callers that don't grant it.
    steps:
      # One open issue per repo and title: a failed run opens it or adds to it, and a green run closes it.
      - shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")"

          if [[ -n "$TESTED" ]]; then
            what="The integration tests ran on dev at $TESTED."
            passed_what="The integration tests passed on dev at $TESTED"
          else
            what="The nightly run deployed \`main\` to dev and ran the integration tests."
            passed_what="The nightly run passed"
          fi

          if [[ "$RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" -R "$GITHUB_REPOSITORY" --comment "$passed_what: $run_url"
            fi
            exit 0
          fi

          # A squash merge's subject ends with its PR's number, which GitHub links in the comment.
          prs=""
          if [[ -n "$TESTED" && -n "$PASSED" ]]; then
            prs="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PASSED...$TESTED" \
              --jq '.commits[] | "- " + (.commit.message | split("\n") | first)')" ||
              prs="- The commits couldn't be listed. Does the caller grant \`contents: read\`?"
          fi

          # The API sometimes cuts a response short, so each read gets three tries. A try's output is
          # printed only when it succeeds, so a failed one leaves nothing half-written.
          retry() {
            local out
            for _ in 1 2 3; do
              if out="$("$@")"; then
                printf '%s\n' "$out"
                return
              fi
              sleep 10
            done
            return 1
          }

          # Set when a log couldn't be read, so the comment doesn't blame the deploy for a gap in the log.
          unread=""
          : > "$RUNNER_TEMP/logs"
          if failed_jobs="$(retry gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .id')"; then
            for job in $failed_jobs; do
              # Not `gh api`: newer gh refuses to print output that holds terminal escapes, as test logs do.
              retry curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" >> "$RUNNER_TEMP/logs" || unread=1
            done
          else
            unread=1
          fi

          # vitest prints `FAIL  <file> > <scenario>`, and Playwright `1) <file> › <scenario>`. Retries repeat them.
          failures="$(sed -E 's/^[^ ]+ //; s/(\x1b|\^\[)\[[0-9;]*m//g' "$RUNNER_TEMP/logs" |
            grep -E '^\s*(FAIL\s|[0-9]+\) )' | sed -E 's/^\s*([0-9]+\) )?//; s/^FAIL\s+//' |
            awk '!seen[$0]++' | head -n 50 || true)"
          {
            echo "$what Its result was \`$RESULT\`."
            echo
            echo "Run: $run_url"
            if [[ -n "$TESTED" ]]; then
              echo
              if [[ -z "$PASSED" ]]; then
                echo "No green run is recorded, so the PRs since one aren't known."
              elif [[ -n "$prs" ]]; then
                echo "Merged since the last green run, at $PASSED:"
                echo
                echo "$prs"
                echo
                echo "Diff: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PASSED...$TESTED"
              else
                echo "Nothing was merged since the last green run, at $PASSED."
              fi
            fi
            echo
            if [[ "$RESULT" == cancelled ]]; then
              echo "It was cancelled before it finished, so dev wasn't fully tested."
            elif [[ -n "$failures" ]]; then
              echo "Failing scenarios:"
              echo
              echo '```'
              echo "$failures"
              echo '```'
              if [[ -n "$unread" ]]; then
                echo
                echo "Some of the run's log couldn't be read, so this list may be short. Read the run."
              fi
            elif [[ -n "$unread" ]]; then
              echo "The run's log couldn't be read, so its failing scenarios aren't known. Read the run."
            else
              echo "No failing scenarios were found in the log, so the deploy or the run itself failed. Read the run."
            fi
          } > "$RUNNER_TEMP/body.md"

          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --assignee "$ASSIGNEE" --body-file "$RUNNER_TEMP/body.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ inputs.result }}
          ASSIGNEE: ${{ inputs.assignee }}
          TITLE: ${{ inputs.title }}
          TESTED: ${{ inputs.tested }}
          PASSED: ${{ inputs.passed }}

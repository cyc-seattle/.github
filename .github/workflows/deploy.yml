name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy to, such as `dev`, `prod-preview`, or `prod`.
        type: string
        required: true
      task:
        description: The mise task to run, `preview`, `deploy`, or `reset`. `none` runs no task, for integration alone.
        type: string
        required: true
      projects:
        description: The Pulumi projects to run the task on, separated by spaces. Empty means the caller's full list.
        type: string
        default: ""
      integration:
        description: Run `mise run integration` after the task.
        type: boolean
        default: false
    outputs:
      changes:
        description: For `preview`, `true` if the preview shows changes and `false` if not. Empty for any other task.
        value: ${{ jobs.deploy.outputs.changes }}

jobs:
  # GitHub keeps one waiting job per concurrency group, and a new one cancels it. So a branch's deploy
  # stays out of the group while a default branch run of the same workflow hasn't finished its deploy to
  # this environment, and can't cancel a merge's deploy (cyc-seattle/platform#69). It finds that deploy
  # by its job name, so a run's later deploys, such as one waiting for prod approval, don't hold it back.
  # No permissions block, so the job gets the caller's: without `actions: read` it warns and goes on.
  wait:
    name: wait
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for the default branch's deploy
        shell: bash
        run: |
          if ! workflow=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id); then
            echo "::warning::Can't read Actions runs, so this deploy doesn't wait for $BRANCH's. Grant the job actions: read."
            exit 0
          fi
          # A run whose deploy job doesn't exist yet is still running what comes before it, so it counts.
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's.
          deploy_busy='[.jobs[] | select(.name == $ENV.JOB or (.name | endswith(" / " + $ENV.JOB)))]
            | length == 0 or any(.status != "completed")'
          deadline=$((SECONDS + 3600))
          while true; do
            if ! runs=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$BRANCH&per_page=20" \
              --jq '.workflow_runs[] | select(.event != "pull_request" and .status != "completed") | .id'); then
              echo "::warning::Can't list $BRANCH's runs, so this deploy doesn't wait for them."
              exit 0
            fi
            busy=""
            for id in $runs; do
              if ! b=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" --jq "$deploy_busy"); then
                echo "::warning::Can't list the jobs of $BRANCH's run $id, so this deploy doesn't wait for them."
                exit 0
              fi
              [[ "$b" == true ]] && busy+=" $SERVER/$REPO/actions/runs/$id"
            done
            [[ -z "$busy" ]] && exit 0
            if ((SECONDS >= deadline)); then
              echo "::warning::$BRANCH's deploy to $ENVIRONMENT is still busy after an hour, so this deploy goes ahead:$busy"
              exit 0
            fi
            echo "Waiting for$busy"
            sleep 60
          done
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.event.repository.default_branch }}
          ENVIRONMENT: ${{ inputs.environment }}
          JOB: deploy to ${{ inputs.environment }}

  deploy:
    # wait finds the job by this name.
    name: deploy to ${{ inputs.environment }}
    needs: wait
    # The default branch skips wait.
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    # One deploy at a time per repo and environment. Cancelling a Pulumi update halfway leaves a lock behind.
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_STACK: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}
      # Pulumi authenticates its plugin downloads from GitHub releases with this, which avoids the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # workflow_call has no choice type. The value also goes into a shell command below.
      - name: Check the task
        shell: bash
        run: |
          [[ "$TASK" =~ ^(preview|deploy|reset|none)$ ]] || { echo "::error::task must be preview, deploy, reset, or none, not '$TASK'"; exit 1; }
        env:
          TASK: ${{ inputs.task }}
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The lockfiles pin the Pulumi CLI and the providers, so they pick the plugins.
      - uses: actions/cache@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'mise.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-
      # This sets GOOGLE_APPLICATION_CREDENTIALS, so the caller's mise.toml must not override it.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: mise run install
      # The fence keeps Markdown from folding the preview into one paragraph. pipefail comes from `shell: bash`.
      - name: Run the task
        id: task
        if: inputs.task != 'none'
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mise run "$TASK" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TASK: ${{ inputs.task }}
          DEPLOY_PROJECTS: ${{ inputs.projects }}
          DEPLOY_CHANGES_FILE: ${{ runner.temp }}/deploy-changes
      - name: Close the summary fence
        if: always() && steps.task.conclusion != 'skipped'
        run: echo '```' >> "$GITHUB_STEP_SUMMARY"
      # A failed preview has already failed the job, so it never reads as no changes.
      - name: Read the preview's changes
        id: changes
        if: inputs.task == 'preview'
        shell: bash
        run: |
          if [[ ! -s "$DEPLOY_CHANGES_FILE" ]]; then
            # A caller whose preview task doesn't report keeps deploying every time.
            echo "::notice::The preview task reported nothing, so changes is true."
            changes=true
          elif grep -qvxE 'true|false' "$DEPLOY_CHANGES_FILE"; then
            echo "::error::Each line of DEPLOY_CHANGES_FILE must be true or false."
            cat "$DEPLOY_CHANGES_FILE"
            exit 1
          elif grep -qx true "$DEPLOY_CHANGES_FILE"; then
            changes=true
          else
            changes=false
          fi
          echo "changes=$changes" | tee -a "$GITHUB_OUTPUT"
        env:
          DEPLOY_CHANGES_FILE: ${{ runner.temp }}/deploy-changes
      - name: Integration tests
        if: inputs.integration
        run: mise run integration
        env:
          DEPLOY_PROJECTS: ${{ inputs.projects }}

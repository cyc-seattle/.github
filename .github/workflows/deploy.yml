name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy to, such as `dev`, `prod-preview`, or `prod`.
        type: string
        required: true
      task:
        description: The mise task to run, `preview`, `deploy`, or `reset`. `none` runs no task, for integration alone, and on dev lets deploys go first.
        type: string
        required: true
      projects:
        description: The Pulumi projects to run the task on, separated by spaces. Empty means the caller's full list.
        type: string
        default: ""
      integration:
        description: Run `mise run integration` after the task.
        type: boolean
        default: false
    outputs:
      changes:
        description: For `preview`, `true` if the preview shows changes and `false` if not. Empty for any other task.
        value: ${{ jobs.deploy.outputs.changes }}
      tested:
        description: For task `none` on dev, the commit the integration tests ran on, the one last deployed there. Empty if they didn't run.
        value: ${{ jobs.deploy.outputs.tested }}
      passed:
        description: For task `none` on dev, the last commit the integration tests passed on before this run. Empty if none is recorded.
        value: ${{ jobs.deploy.outputs.passed }}
      skipped:
        description: For task `none` on dev, `true` if the tests didn't run because nothing was deployed since they last ran.
        value: ${{ jobs.deploy.outputs.skipped }}

# Where this run's merge group stands in the queue: `newer` if a later entry contains it, `last`,
# `stale` if the queue has rebuilt it since, or `gone`.
env:
  QUEUE_QUERY: >-
    query($owner: String!, $name: String!, $branch: String!) {
      repository(owner: $owner, name: $name) {
        mergeQueue(branch: $branch) {
          entries(first: 100) { nodes { position state pullRequest { number } headCommit { oid } } }
        }
      }
    }
  # An UNMERGEABLE entry, one that conflicts, never starts a run, so it can't test this one. The
  # wait job re-reads this each minute, so a newer entry that turns UNMERGEABLE makes this one last.
  QUEUE_STATE: >-
    (map(select(.pullRequest.number == $pr)) | first) as $me
    | if $me == null then "gone"
      elif $me.headCommit.oid != $sha then "stale"
      elif any(.[]; .position > $me.position and .state != "UNMERGEABLE") then "newer"
      else "last" end

jobs:
  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
      superseded: ${{ steps.gate.outputs.superseded }}
      tested: ${{ steps.state.outputs.tested }}
      passed: ${{ steps.state.outputs.passed }}
      skipped: ${{ steps.state.outputs.skipped }}
    # One deploy at a time per repo and environment. Cancelling a Pulumi update halfway leaves a lock behind.
    # Dev deploys wait in line, so a newer one never cancels one still waiting. Prod's newest replaces any waiting.
    # A test run (`none`) has its own group, so it never holds up the repo's next deploy before dev's lock can
    # put that deploy first. Its newest replaces any waiting, as the caller's own group does.
    concurrency: &lock
      group: ${{ inputs.task == 'none' && 'integration' || 'deploy' }}-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
      queue: ${{ inputs.environment == 'dev' && inputs.task != 'none' && 'max' || 'single' }}
    permissions: &permissions
      id-token: write
      contents: read
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_STACK: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}
      # Pulumi authenticates its plugin downloads from GitHub releases with this, which avoids the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
      RETRY: false
      # Where dev's lock lives.
      DEV_CLUSTER: cyc
      DEV_LOCATION: us-west1
      DEV_NAMESPACE: dev
    steps: &steps
      - name: Check the task
        shell: bash
        # workflow_call has no choice type. The value also goes into a shell command below.
        run: |
          [[ "$TASK" =~ ^(preview|deploy|reset|none)$ ]] || { echo "::error::task must be preview, deploy, reset, or none, not '$TASK'"; exit 1; }
        env:
          TASK: ${{ inputs.task }}
      # A queued PR's run skips the deploy when a later entry, whose merge group contains this one, is
      # queued behind it. That entry tests the whole batch, and HEADGREEN merges the batch if it passes.
      - name: Check for a newer entry in the merge queue
        id: gate
        shell: bash
        run: |
          if [[ "$EVENT" != merge_group || "$RETRY" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr="${HEAD_REF##*/pr-}"
          pr="${pr%%-*}"
          state="$(gh api graphql -f query="$QUEUE_QUERY" -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" -f branch="${BASE_REF#refs/heads/}" \
            --jq .data.repository.mergeQueue.entries.nodes |
            jq -r --argjson pr "$pr" --arg sha "$GITHUB_SHA" "$QUEUE_STATE")"
          case "$state" in
            last) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            newer)
              echo "::notice::A newer PR in the merge queue contains this one, so its run tests both."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              ;;
            # Failing a run that no longer counts is harmless, and fails closed if the query is wrong.
            *)
              echo "::error::This merge group is $state in the queue, so this run doesn't count."
              exit 1
              ;;
          esac
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.deploy == 'true'
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      # The lockfiles pin the Pulumi CLI and the providers, so they pick the plugins.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'mise.lock') }}
          restore-keys: pulumi-plugins-${{ runner.os }}-
      # This sets GOOGLE_APPLICATION_CREDENTIALS, so the caller's mise.toml must not override it.
      - if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: steps.gate.outputs.deploy == 'true'
        run: mise run install
      # Every repo deploys to and tests against the same dev, and a concurrency group can't span repos
      # (#34). So dev's runs take turns through a ConfigMap in its namespace: creating it is atomic,
      # and a run that dies without releasing it leaves it to expire. This writes the helpers that the
      # steps below share.
      - name: Connect to dev
        id: dev
        if: steps.gate.outputs.deploy == 'true' && inputs.environment == 'dev'
        shell: bash
        run: |
          cluster="$(gcloud container clusters describe "$DEV_CLUSTER" --location "$DEV_LOCATION" \
            --format='value(endpoint,masterAuth.clusterCaCertificate)')"
          base64 -d <<< "${cluster##*[[:space:]]}" > "$RUNNER_TEMP/dev-ca.crt"
          echo "url=https://${cluster%%[[:space:]]*}/api/v1/namespaces/$DEV_NAMESPACE/configmaps" > "$RUNNER_TEMP/dev.sh"
          cat >> "$RUNNER_TEMP/dev.sh" <<'EOF'
          holder="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          # This run's key in dev-lock-deploys, while it's a deploy waiting for the lock.
          waiter="${GITHUB_REPOSITORY//\//.}.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          # This repo's record of the commit last deployed to dev, and the last ones tested and passed there.
          state="dev-state-${GITHUB_REPOSITORY//\//.}"
          state="${state,,}"

          # kube METHOD [CONFIGMAP [BODY]] prints the status, and leaves the response in $RUNNER_TEMP/kube.json.
          kube() {
            local type=application/json
            if [[ "$1" == PATCH ]]; then type=application/merge-patch+json; fi
            curl -sS --cacert "$RUNNER_TEMP/dev-ca.crt" -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H "Content-Type: $type" -X "$1" ${3:+--data "$3"} -o "$RUNNER_TEMP/kube.json" -w '%{http_code}' \
              "$url${2:+/$2}" || true
          }

          # merge CONFIGMAP DATA merges DATA, a JSON object, into the ConfigMap's data. A null value removes its key.
          merge() {
            local status
            status="$(kube PATCH "$1" "{\"data\":$2}")"
            if [[ "$status" == 404 ]]; then
              status="$(kube POST "" "$(jq -n --arg name "$1" --argjson data "$2" \
                '{apiVersion: "v1", kind: "ConfigMap", metadata: {name: $name}, data: ($data | with_entries(select(.value != null)))}')")"
              # 409 means another run created it first.
              if [[ "$status" == 409 ]]; then status="$(kube PATCH "$1" "{\"data\":$2}")"; fi
            fi
            [[ "$status" == 200 || "$status" == 201 ]] || { echo "::warning::Writing $1 returned $status."; return 1; }
          }

          # Whether a deploy is waiting for the lock. Each refreshes its key while it waits, so a dead one's soon expires.
          deploy_waiting() {
            [[ "$(kube GET dev-lock-deploys)" == 200 ]] &&
              jq -e --argjson now "$(date +%s)" '.data // {} | any(.[]; tonumber > $now)' "$RUNNER_TEMP/kube.json" > /dev/null
          }

          # Releases only this run's lock: one held past its expiry may belong to another run by now. The
          # resourceVersion stops a delete racing a run that took it over.
          release() {
            local status rv
            status="$(kube GET dev-lock)"
            if [[ "$status" != 200 || "$(jq -r .data.holder "$RUNNER_TEMP/kube.json")" != "$holder" ]]; then
              echo "::warning::This run no longer holds dev's lock."
              return 0
            fi
            rv="$(jq -r .metadata.resourceVersion "$RUNNER_TEMP/kube.json")"
            status="$(kube DELETE dev-lock "{\"preconditions\":{\"resourceVersion\":\"$rv\"}}")"
            if [[ "$status" != 200 ]]; then
              echo "::warning::Releasing dev's lock returned $status, so it waits out its expiry."
              cat "$RUNNER_TEMP/kube.json"
            fi
          }
          EOF
      # Deploys go first, so prod never waits behind a test run. A waiting deploy keeps a key in
      # dev-lock-deploys, and a test run (`none`) takes the lock only while no deploy is waiting.
      - name: Wait for dev's lock
        id: lock
        if: steps.dev.conclusion == 'success'
        timeout-minutes: 120
        shell: bash
        run: |
          source "$RUNNER_TEMP/dev.sh"
          while true; do
            if [[ "$TASK" != none ]]; then
              merge dev-lock-deploys "{\"$waiter\": \"$(($(date +%s) + 300))\"}" || true
            elif deploy_waiting; then
              echo "Waiting for a deploy to go first."
              sleep 30
              continue
            fi
            body="$(jq -n --arg holder "$holder" --arg expires "$(($(date +%s) + LOCK_MINUTES * 60))" --arg rv "${rv:-}" \
              '{apiVersion: "v1", kind: "ConfigMap", metadata: ({name: "dev-lock"} + if $rv == "" then {} else {resourceVersion: $rv} end), data: {holder: $holder, expires: $expires}}')"
            if [[ -z "${rv:-}" ]]; then
              status="$(kube POST "" "$body")"
            else
              status="$(kube PUT dev-lock "$body")"
            fi
            rv=
            if [[ "$status" == 200 || "$status" == 201 ]]; then
              if [[ "$TASK" != none ]]; then
                merge dev-lock-deploys "{\"$waiter\": null}" || true
              elif deploy_waiting; then
                # A deploy started waiting while this run took the lock.
                echo "A deploy is waiting, so this run lets it go first."
                release
                continue
              fi
              echo "This run holds dev's lock."
              exit 0
            fi
            # 409 means another run holds it, or took it first. Anything else is retried too.
            status="$(kube GET dev-lock)"
            if [[ "$status" == 200 ]]; then
              if (($(jq -r .data.expires "$RUNNER_TEMP/kube.json") < $(date +%s))); then
                echo "::warning::$(jq -r .data.holder "$RUNNER_TEMP/kube.json") held dev's lock past its expiry, so this run takes it."
                rv="$(jq -r .metadata.resourceVersion "$RUNNER_TEMP/kube.json")"
                continue
              fi
              echo "Waiting for $(jq -r .data.holder "$RUNNER_TEMP/kube.json") to finish with dev."
            elif [[ "$status" != 404 ]]; then
              echo "::warning::Reading dev's lock returned $status."
            fi
            sleep 30
          done
        env:
          TASK: ${{ inputs.task }}
          LOCK_MINUTES: 75
      # A test run tests the commit last deployed to dev, which may be newer than its own if a deploy
      # went first. It skips a commit it already tested, so it runs only once something new is on dev.
      - name: Find the commit on dev
        id: state
        if: steps.lock.conclusion == 'success' && inputs.task == 'none'
        shell: bash
        run: |
          source "$RUNNER_TEMP/dev.sh"
          status="$(kube GET "$state")"
          if [[ "$status" == 404 ]]; then
            echo '{}' > "$RUNNER_TEMP/kube.json"
          elif [[ "$status" != 200 ]]; then
            echo "::error::Reading $state returned $status."
            exit 1
          fi
          deployed="$(jq -r '.data.deployed // empty' "$RUNNER_TEMP/kube.json")"
          tested="$(jq -r '.data.tested // empty' "$RUNNER_TEMP/kube.json")"
          echo "passed=$(jq -r '.data.passed // empty' "$RUNNER_TEMP/kube.json")" >> "$GITHUB_OUTPUT"
          if [[ -z "$deployed" ]]; then
            echo "::notice::No dev deploy of this repo is recorded, so this run tests its own commit."
            deployed="$GITHUB_SHA"
          fi
          if [[ "$deployed" == "$tested" && "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            echo "::notice::The integration tests already ran on $deployed, the commit on dev. Re-run this job to run them again."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tested=$deployed" >> "$GITHUB_OUTPUT"
          if [[ "$deployed" != "$(git rev-parse HEAD)" ]]; then
            echo "Dev has $deployed, so this run tests that."
            git fetch --no-tags --depth=1 origin "$deployed"
            git checkout -q --detach FETCH_HEAD
            mise install
            mise run install
          fi
      # The fence keeps Markdown from folding the preview into one paragraph. pipefail comes from `shell: bash`.
      - name: Run the task
        id: task
        if: steps.gate.outputs.deploy == 'true' && inputs.task != 'none'
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mise run "$TASK" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TASK: ${{ inputs.task }}
          DEPLOY_PROJECTS: ${{ inputs.projects }}
          DEPLOY_CHANGES_FILE: ${{ runner.temp }}/deploy-changes
      - name: Close the summary fence
        if: always() && steps.task.conclusion != 'skipped'
        run: echo '```' >> "$GITHUB_STEP_SUMMARY"
      # A failed preview has already failed the job, so it never reads as no changes.
      - name: Read the preview's changes
        id: changes
        if: steps.gate.outputs.deploy == 'true' && inputs.task == 'preview'
        shell: bash
        run: |
          if [[ ! -s "$DEPLOY_CHANGES_FILE" ]]; then
            # A caller whose preview task doesn't report keeps deploying every time.
            echo "::notice::The preview task reported nothing, so changes is true."
            changes=true
          elif grep -qvxE 'true|false' "$DEPLOY_CHANGES_FILE"; then
            echo "::error::Each line of DEPLOY_CHANGES_FILE must be true or false."
            cat "$DEPLOY_CHANGES_FILE"
            exit 1
          elif grep -qx true "$DEPLOY_CHANGES_FILE"; then
            changes=true
          else
            changes=false
          fi
          echo "changes=$changes" | tee -a "$GITHUB_OUTPUT"
        env:
          DEPLOY_CHANGES_FILE: ${{ runner.temp }}/deploy-changes
      # A test run tests the commit last deployed to dev, so a deploy records it.
      - name: Record the deploy
        if: steps.dev.conclusion == 'success' && inputs.task == 'deploy'
        shell: bash
        run: |
          source "$RUNNER_TEMP/dev.sh"
          merge "$state" "{\"deployed\": \"$GITHUB_SHA\"}"
      - name: Integration tests
        id: integration
        if: steps.gate.outputs.deploy == 'true' && inputs.integration && steps.state.outputs.skipped != 'true'
        run: mise run integration
        env:
          DEPLOY_PROJECTS: ${{ inputs.projects }}
      # So the next test run skips what's already tested, and a failure's report can list the PRs since the last pass.
      - name: Record the test run
        if: >-
          always() && steps.dev.conclusion == 'success' &&
          (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')
        continue-on-error: true
        shell: bash
        run: |
          source "$RUNNER_TEMP/dev.sh"
          merge "$state" "$(jq -n --arg sha "$TESTED" --argjson passed "$PASSED" '{tested: $sha} + if $passed then {passed: $sha} else {} end')"
        env:
          TESTED: ${{ steps.state.outputs.tested || github.sha }}
          PASSED: ${{ steps.integration.outcome == 'success' }}
      - name: Release dev's lock
        if: always() && steps.dev.conclusion == 'success'
        # A lock left behind expires, so failing to release it mustn't fail a run that passed.
        continue-on-error: true
        shell: bash
        run: |
          source "$RUNNER_TEMP/dev.sh"
          # A deploy cancelled while it waited leaves its key behind.
          if [[ "$TASK" != none ]]; then merge dev-lock-deploys "{\"$waiter\": null}" || true; fi
          if [[ "$LOCKED" == true ]]; then release; fi
        env:
          TASK: ${{ inputs.task }}
          LOCKED: ${{ steps.lock.conclusion == 'success' }}
      # So a failed journey's page snapshot and trace can be read. Playwright writes them to test-results/.
      - name: Upload test results
        if: failure() && inputs.integration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ inputs.environment }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A superseded run waits outside the lock for the batch it joined. If the newer PRs fail and leave
  # the queue, this PR is the last entry again, and deploys on its own once.
  wait:
    needs: deploy
    if: needs.deploy.outputs.superseded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      retry: ${{ steps.wait.outputs.retry }}
    permissions:
      contents: read
    steps:
      - id: wait
        shell: bash
        run: |
          pr="${HEAD_REF##*/pr-}"
          pr="${pr%%-*}"
          while true; do
            state="$(gh api graphql -f query="$QUEUE_QUERY" -f owner="${GITHUB_REPOSITORY%/*}" \
              -f name="${GITHUB_REPOSITORY#*/}" -f branch="${BASE_REF#refs/heads/}" \
              --jq .data.repository.mergeQueue.entries.nodes |
              jq -r --argjson pr "$pr" --arg sha "$GITHUB_SHA" "$QUEUE_STATE")"
            case "$state" in
              newer) sleep 60 ;;
              last)
                echo "::warning::The newer PRs in this batch failed and left the queue, so this PR deploys on its own."
                echo "retry=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${BASE_REF#refs/heads/}" --jq .status)"
                if [[ "$status" == identical || "$status" == ahead ]]; then
                  echo "Merged with its batch."
                  exit 0
                fi
                echo "::error::This merge group is $state in the queue and didn't merge, so this run doesn't count."
                exit 1
                ;;
            esac
          done
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
  retry:
    name: retry deploy to ${{ inputs.environment }}
    needs: wait
    if: needs.wait.outputs.retry == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: *lock
    permissions: *permissions
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_STACK: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}
      GITHUB_TOKEN: ${{ github.token }}
      RETRY: true
      DEV_CLUSTER: cyc
      DEV_LOCATION: us-west1
      DEV_NAMESPACE: dev
    steps: *steps

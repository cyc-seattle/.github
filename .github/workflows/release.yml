name: release

on:
  workflow_call:
    inputs:
      image:
        description: The image to publish when a version is released, such as `ghcr.io/cyc-seattle/clubspot-fake`. Leave empty to publish none.
        type: string
        default: ""
      image-context:
        description: The Docker build context.
        type: string
        default: .
      image-file:
        description: The Dockerfile, relative to the repo root.
        type: string
        default: Dockerfile

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    concurrency: release-${{ github.repository }}
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run install
      # The comment and label options are off, so the job needs no issues or pull-requests permission,
      # and no `released` label is created.
      # semantic-release tags the commit it releases, so a new latest tag means this run released.
      - name: Find the current version
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' || true)" >> "$GITHUB_OUTPUT"
      - name: Release
        run: npx --yes semantic-release@25 --no-success-comment --no-fail-comment --no-released-labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Find the new version
        id: after
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' || true)" >> "$GITHUB_OUTPUT"
      # A tag pushed with GITHUB_TOKEN starts no other workflow, so the image is built here.
      - name: Check for a release to publish
        id: publish
        if: inputs.image != '' && steps.after.outputs.tag != steps.before.outputs.tag
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.after.outputs.tag }}
      - uses: docker/login-action@v4
        if: steps.publish.outputs.version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        if: steps.publish.outputs.version
      # The source label links the package to the caller's repo, which gives it that repo's visibility.
      - uses: docker/build-push-action@v7
        if: steps.publish.outputs.version
        with:
          context: ${{ inputs.image-context }}
          file: ${{ inputs.image-file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image }}:${{ steps.publish.outputs.version }}
            ${{ inputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

name: release

on:
  workflow_call:

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    concurrency: release-${{ github.repository }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: mise run install
      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      # pnpm 10 runs `npm publish` from the path.
      - name: Install npm 11
        run: |
          npm install --global npm@^11.5.1
          npm --version
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm exec changeset publish
      # GitHub holds the pull_request runs on a PR that GITHUB_TOKEN opens or updates until someone approves them.
      # A run that workflow_dispatch starts does not attach its check to the PR.
      - name: Approve CI on the Version Packages PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          for _ in $(seq 24); do
            runs=$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$sha" --jq '.workflow_runs[] | "\(.id) \(.status)"')
            if [ -n "$runs" ]; then
              echo "$runs" | while read -r id status; do
                if [ "$status" = action_required ]; then
                  gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve"
                  echo "Approved run $id."
                fi
              done
              exit 0
            fi
            sleep 5
          done
          echo "No pull_request run appeared for $sha. Nothing to approve."

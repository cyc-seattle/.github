name: release

on:
  workflow_call:
    inputs:
      image:
        description: The image to publish when a version is released, such as `ghcr.io/cyc-seattle/clubspot-fake`. Leave empty to publish none.
        type: string
        default: ""
      image-context:
        description: The Docker build context.
        type: string
        default: .
      image-file:
        description: The Dockerfile, relative to the repo root.
        type: string
        default: Dockerfile

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    concurrency: release-${{ github.repository }}
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.after.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run install
      # semantic-release tags the commit it releases, so a changed latest tag means this run released.
      - name: Find the current version
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' || true)" >> "$GITHUB_OUTPUT"
      # The comment and label options are off, so the job needs no issues or pull-requests permission,
      # and no `released` label is created. semantic-release and its default plugins are pinned to exact
      # versions, so a new release of any of them can't run with this job's rights until Renovate
      # bumps it here.
      - name: Release
        run: >-
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/commit-analyzer@13.0.1
          --package @semantic-release/release-notes-generator@14.1.1
          --package @semantic-release/npm@13.2.0
          --package @semantic-release/github@12.0.10
          -- semantic-release --no-success-comment --no-fail-comment --no-released-labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The version output stays empty when the run released nothing.
      - name: Find the new version
        id: after
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' || true)
          [ "$tag" = "$BEFORE" ] || echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          BEFORE: ${{ steps.before.outputs.tag }}

  # A tag pushed with GITHUB_TOKEN starts no other workflow, so the image is built here. It is its own job
  # with no permissions block, so release callers that publish no image need not grant packages: write.
  image:
    name: image
    needs: release
    if: inputs.image != '' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      # The source label links the package to the caller's repo, which gives it that repo's visibility.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.image-context }}
          file: ${{ inputs.image-file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image }}:${{ needs.release.outputs.version }}
            ${{ inputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

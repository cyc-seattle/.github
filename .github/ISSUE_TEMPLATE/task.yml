name: Task
description: Record work that adds no new behavior, such as a cleanup or an upgrade.
type: Task
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to do, and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How to tell that the task is complete.
